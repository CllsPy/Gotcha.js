<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gotcha</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Gotcha <span class="badge">AI</span></h1>
      <p class="instrucao">
        Selecione qualquer palavra ou frase (até 5 palavras) em qualquer página
        da web — a explicação aparece ali mesmo!
      </p>

      <div class="demo-hint">
        <span class="demo-icon">👆</span>
        <span>Experimente selecionar texto em qualquer aba aberta</span>
      </div>

      <div class="config-section">
        <label for="api-key-input">OpenAI API Key</label>
        <input
          id="api-key-input"
          type="password"
          placeholder="sk-..."
          autocomplete="off"
        />
        <button id="api-key-save">Salvar</button>
        <div id="api-key-status" class="status"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
